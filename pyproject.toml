[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-subtitle-extractor"
version = "0.1.0"
description = "Local video/audio subtitle extraction service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
asr = [
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "transformers>=4.53,<5",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
subtitle-extractor = "subtitle_extractor.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_extractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
